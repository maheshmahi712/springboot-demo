apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-app
  template:
    metadata:
      labels:
        app: springboot-app
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: springboot-app
          image: ${IMAGE_NAME}:${BUILD_NUMBER}
          ports:
            - containerPort: 8080
